<svg width="960" height="620" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="app-bg-about" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f0a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="960" height="620" rx="16" fill="url(#app-bg-about)" stroke="#173617" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M0,16 a16,16 0 0 1 16,-16 h928 a16,16 0 0 1 16,16 v20 h-960 z" fill="#0d130d"/>
  <circle cx="26" cy="18" r="5" fill="#24361f"/>
  <circle cx="44" cy="18" r="5" fill="#24361f"/>
  <circle cx="62" cy="18" r="5" fill="#24361f"/>
  <text x="480" y="22" text-anchor="middle" font-size="12" fill="#3f5c3f">homebrew-weather — zsh</text>

  <!-- back link -->
  <text x="40" y="66" font-size="12" letter-spacing="1" fill="#3f5c3f">← cd ~/</text>

  <!-- header -->
  <text x="40" y="112" font-size="30" fill="#33ff66">$ man homebrew-weather</text>

  <!-- man box -->
  <rect x="40" y="138" width="880" height="440" fill="none" stroke="#1c351c" stroke-width="1"/>

  <text x="60" y="176" font-size="13" fill="#3f5c3f">NAME</text>
  <text x="60" y="200" font-size="15" fill="#e6ece6">homebrew-weather — pixel-art weather forecast for developers</text>

  <text x="60" y="240" font-size="13" fill="#3f5c3f">SYNOPSIS</text>
  <text x="60" y="264" font-size="15" fill="#e6ece6">A tiny weather PWA styled like a 1980s phosphor CRT terminal.</text>
  <text x="60" y="286" font-size="15" fill="#e6ece6">16×16 hand-drawn pixel icons, dev jokes for every condition,</text>
  <text x="60" y="308" font-size="15" fill="#e6ece6">ASCII forecast, and a widget-shaped home tile. Install it on your</text>
  <text x="60" y="330" font-size="15" fill="#e6ece6">phone (Add to Home Screen) and it launches full-screen with its</text>
  <text x="60" y="352" font-size="15" fill="#e6ece6">own app icon.</text>

  <text x="60" y="392" font-size="13" fill="#3f5c3f">DATA</text>
  <text x="60" y="416" font-size="15" fill="#e6ece6">Weather + geocoding: <tspan fill="#ffb000" text-decoration="underline">open-meteo.com</tspan> — free, no key, no tracking.</text>
  <text x="60" y="438" font-size="15" fill="#e6ece6">Location comes from your browser's Geolocation API; nothing</text>
  <text x="60" y="460" font-size="15" fill="#e6ece6">leaves your device except the coords sent to Open-Meteo.</text>

  <text x="60" y="500" font-size="13" fill="#3f5c3f">BUGS</text>
  <text x="60" y="524" font-size="15" fill="#e6ece6">// TODO: teach it to make coffee</text>

  <text x="60" y="562" font-size="15" fill="#3f5c3f"># EOF<tspan fill="#e6ece6">_</tspan></text>
</svg>
