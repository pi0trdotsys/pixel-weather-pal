<svg width="960" height="620" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="app-bg-settings" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f0a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <rect width="960" height="620" rx="16" fill="url(#app-bg-settings)" stroke="#173617" stroke-width="1.5"/>

  <!-- title bar -->
  <path d="M0,16 a16,16 0 0 1 16,-16 h928 a16,16 0 0 1 16,16 v20 h-960 z" fill="#0d130d"/>
  <circle cx="26" cy="18" r="5" fill="#24361f"/>
  <circle cx="44" cy="18" r="5" fill="#24361f"/>
  <circle cx="62" cy="18" r="5" fill="#24361f"/>
  <text x="480" y="22" text-anchor="middle" font-size="12" fill="#3f5c3f">homebrew-weather — zsh</text>

  <!-- back link -->
  <text x="40" y="66" font-size="12" letter-spacing="1" fill="#3f5c3f">← cd ~/</text>

  <!-- header -->
  <text x="40" y="108" font-size="26" fill="#33ff66">$ vim /etc/homebrew-weather.conf</text>

  <!-- settings box -->
  <rect x="40" y="134" width="880" height="446" fill="none" stroke="#1c351c" stroke-width="1"/>

  <text x="60" y="172" font-size="12" letter-spacing="1" fill="#3f5c3f">REFRESH</text>
  <rect x="60" y="184" width="840" height="40" fill="none" stroke="#1c351c" stroke-width="1"/>
  <text x="76" y="209" font-size="14" fill="#e6ece6">auto-refresh interval (app + home-screen widget)</text>
  <rect x="780" y="192" width="100" height="24" fill="none" stroke="#3f5c3f" stroke-width="1"/>
  <text x="830" y="209" text-anchor="middle" font-size="13" fill="#33ff66">30m</text>

  <text x="60" y="258" font-size="12" letter-spacing="1" fill="#3f5c3f">NOTIFICATIONS</text>

  <!-- rain toggle -->
  <rect x="60" y="270" width="840" height="38" fill="none" stroke="#1c351c" stroke-width="1"/>
  <text x="76" y="294" font-size="14" fill="#e6ece6">rain incoming</text>
  <rect x="808" y="278" width="46" height="22" fill="#33ff66"/>
  <text x="831" y="294" text-anchor="middle" font-size="11" fill="#05080a" letter-spacing="1">ON</text>

  <!-- high toggle -->
  <rect x="60" y="312" width="840" height="38" fill="none" stroke="#1c351c" stroke-width="1"/>
  <text x="76" y="336" font-size="14" fill="#e6ece6">high temperature</text>
  <rect x="808" y="320" width="46" height="22" fill="#33ff66"/>
  <text x="831" y="336" text-anchor="middle" font-size="11" fill="#05080a" letter-spacing="1">ON</text>

  <!-- high threshold -->
  <rect x="60" y="354" width="840" height="38" fill="none" stroke="#1c351c" stroke-width="1"/>
  <text x="76" y="378" font-size="14" fill="#e6ece6">↳ threshold</text>
  <text x="880" y="378" text-anchor="end" font-size="14" fill="#e6ece6">30<tspan fill="#3f5c3f">°C</tspan></text>

  <!-- low toggle -->
  <rect x="60" y="396" width="840" height="38" fill="none" stroke="#1c351c" stroke-width="1"/>
  <text x="76" y="420" font-size="14" fill="#e6ece6">low temperature</text>
  <rect x="808" y="404" width="46" height="22" fill="#33ff66"/>
  <text x="831" y="420" text-anchor="middle" font-size="11" fill="#05080a" letter-spacing="1">ON</text>

  <!-- low threshold -->
  <rect x="60" y="438" width="840" height="38" fill="none" stroke="#1c351c" stroke-width="1"/>
  <text x="76" y="462" font-size="14" fill="#e6ece6">↳ threshold</text>
  <text x="880" y="462" text-anchor="end" font-size="14" fill="#e6ece6">0<tspan fill="#3f5c3f">°C</tspan></text>

  <!-- swing toggle -->
  <rect x="60" y="480" width="840" height="38" fill="none" stroke="#1c351c" stroke-width="1"/>
  <text x="76" y="504" font-size="14" fill="#e6ece6">big day-to-day swing</text>
  <rect x="808" y="488" width="46" height="22" fill="#33ff66"/>
  <text x="831" y="504" text-anchor="middle" font-size="11" fill="#05080a" letter-spacing="1">ON</text>

  <!-- swing threshold -->
  <rect x="60" y="522" width="840" height="38" fill="none" stroke="#1c351c" stroke-width="1"/>
  <text x="76" y="546" font-size="14" fill="#e6ece6">↳ min. delta</text>
  <text x="880" y="546" text-anchor="end" font-size="14" fill="#e6ece6">8<tspan fill="#3f5c3f">°C</tspan></text>

  <text x="60" y="570" font-size="11" fill="#3f5c3f">// read directly by the widget's background worker — no need to open the app</text>
</svg>
